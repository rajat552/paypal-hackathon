services:
  - type: web
    name: paymesh-ai-gateway
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        value: https://paypal-hackathon-mu.vercel.app
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: paymesh-postgres
          property: connectionString
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_AI_ENDPOINT
        value: https://ai.mongodb.com
      - key: MONGODB_MODEL_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false

databases:
  - name: paymesh-postgres
    plan: free
    region: oregon
    databaseName: paymesh
    user: paymesh
