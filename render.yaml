services:
  - type: web
    name: paymesh-ai-gateway
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build && cd .. && alembic upgrade head
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: paymesh-postgres
          property: connectionString
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false

databases:
  - name: paymesh-postgres
    plan: free
    region: oregon
    databaseName: paymesh
    user: paymesh
