[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Check standard errors, undefined names, unused imports, bugbear, blind exceptions, and ruff specifics
select = ["E4", "E7", "E9", "F", "B", "BLE", "RUF"]
ignore = [
    "B008",  # Allow FastAPI Depends() in route function signatures
    "E501",  # Line length is handled by formatter
    "RUF012", # Pydantic/SQLAlchemy mutable class attributes
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Security",
    "Depends",
    "Header",
    "Query",
]

[tool.pyright]
include = ["backend", "client", "scripts", "server"]
extraPaths = [
    ".",
    "C:/Users/LENOVO/AppData/Local/Programs/Python/Python313/Lib/site-packages"
]
reportMissingImports = false
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

